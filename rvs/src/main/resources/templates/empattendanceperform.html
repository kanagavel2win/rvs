<script type="text/javascript">
$(document)
.ready(
		function() {
			//--------------------------------------------------------------------------------------------------------------------------------------
			
			//--------------------------------------------------------------------------------------------------------------------------------------		 		

			$(function() {
				var token = $("meta[name='_csrf']").attr(
						"content");
				var header = $("meta[name='_csrf_header']")
						.attr("content");
				$(document).ajaxSend(
						function(e, xhr, options) {
							xhr.setRequestHeader(header,
									token);
						});
			});
			// --------------------------------------------------------------------
			  const flatpickrRange = document.querySelector('#flatpickr-range');
			// Range
			  if (typeof flatpickrRange != undefined) {
			    flatpickrRange.flatpickr({
			      mode: 'range'
			    });
			  }	
			// --------------------------------------------------------------------
			$(".dateRange_search").click(function(){
				let dateRange = $("#flatpickr-range").val();
				if(dateRange.indexOf("to")>0)
				{
					 requestUrl = "rptattendanceperformancereport?dateRange="+dateRange +"&branch="+ $("#branch").val();
					 window.location.href= requestUrl;
					
				}else
				{
					alert("Date Range is incorrect");
				}
			});			
			// --------------------------------------------------------------------
			
		});	

</script>
